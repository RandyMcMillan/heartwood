[package]
name = "radicle-ci-broker"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
authors = ["Lars Wirzenius <liw@liw.fi", "cloudhead <cloudhead@radicle.xyz>"]
description = "add integration to CI engins or systems to a Radicle node"
license = "MIT OR Apache-2.0"
homepage = "https://radicle.xyz"
repository = "https://app.radicle.xyz/nodes/radicle.liw.fi/rad:zwTxygwuz5LDGBq255RA2CbNGrz8"
categories = ["development-tools::build-utils"]

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.11", features = ["derive", "wrap_help"] }
html-page = "0.4.0"
radicle-git-ext = "0.8.0"
radicle-surf = { version = "0.22.0", default-features = false, features = ["serde"] }
regex = "1.10.5"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.121"
serde_yml = "0.0.11"
slog = { version = "2.7.0", features = ["release_max_level_trace"] }
slog-json = "2.6.1"
slog-scope = "4.4.0"
sqlite = "0.32.0"
sqlite3-sys = "0.15.0"
subplotlib = "0.11.0"
thiserror = "1.0.63"
time = { version = "0.3.36", features = ["formatting", "macros"] }
uuid = { version = "1.10.0", features = ["v4"] }

[dependencies.radicle]
version = "0.13.0"
features = ["default", "test"]

[dev-dependencies]
ctor = "0.2.8"
culpa = "1.0.2"
tempfile = { version = "3.10.1" }

[build-dependencies]
subplot-build = "0.11.0"
